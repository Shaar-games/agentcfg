name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.25'
          cache: true
      - run: go vet ./...
      - run: go test -count=1 -timeout=120s ./...
      - run: go build ./cmd/agentmux
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=180s ./...
