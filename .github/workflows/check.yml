name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS 26 pools intermittently fail hosted-runner acquisition.
        # Keep all macOS checks on the supported Intel macOS 15 pool;
        # release builds still target both architectures.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks
        run: go vet ./...
      - name: Release CI gate checks
        if: runner.os == 'Linux'
        run: bash .github/scripts/test-release-ci.sh
      - name: Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Unit and integration tests
        run: go test -shuffle=on -count=1 -timeout=300s ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Native OAuth consent in Chrome
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $browser = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chrome is required for the native OAuth browser regression' }
          $nodeExecutable = (Get-Command node -CommandType Application -ErrorAction Stop).Source
          go test ./internal/gateway -run '^TestNativeOAuthBrowserNavigation$' -count=1 -timeout=120s -args "-agentcfg-browser-executable=$browser" "-agentcfg-browser-node=$nodeExecutable"
          if ($LASTEXITCODE -ne 0) { throw 'Native OAuth browser regression failed' }
      - name: Real npx MCP through stdio and broker
        timeout-minutes: 10
        env:
          AGENTCFG_TEST_NPX: '1'
        run: go test ./internal/upstream ./cmd/agentcfg -run '^Test(NPXFilesystem|CLINPXFilesystem)$' -count=1 -timeout=300s
      - name: CLI build
        run: go build -o ${{ runner.temp }}/agentcfg${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/agentcfg
      - name: No-argument CLI help
        shell: bash
        run: |
          help="$(go run ./cmd/agentcfg)"
          [[ "$help" == *"Usage: agentcfg"* ]]
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=180s ./...
