name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS arm64 runners have been failing acquisition
        # before any steps run. Test the same macOS suite on the supported
        # Intel macOS 26 image; release builds still target both architectures.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -count=1 -timeout=120s ./...
      - name: CLI build
        run: go build -o ${{ runner.temp }}/agentcfg${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/agentcfg
      - name: No-argument CLI help
        shell: bash
        run: |
          help="$(go run ./cmd/agentcfg)"
          [[ "$help" == *"Usage: agentcfg"* ]]
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=180s ./...
