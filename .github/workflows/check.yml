name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS 26 pools intermittently fail hosted-runner acquisition.
        # Keep all macOS checks on the supported Intel macOS 15 pool;
        # release builds still target both architectures.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks
        run: go vet ./...
      - name: Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Unit and integration tests
        run: go test -shuffle=on -count=1 -timeout=120s ./...
      - name: CLI build
        run: go build -o ${{ runner.temp }}/agentcfg${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/agentcfg
      - name: No-argument CLI help
        shell: bash
        run: |
          help="$(go run ./cmd/agentcfg)"
          [[ "$help" == *"Usage: agentcfg"* ]]
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=180s ./...
